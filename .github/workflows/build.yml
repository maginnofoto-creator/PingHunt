name: PingHunt bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Firebase-Zugangsdaten einsetzen
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Das Secret FIREBASE_CONFIG fehlt. Siehe README.md, Schritt 3."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG" > config.json
          python3 -c "import json; d=json.load(open('config.json')); missing=[k for k in ['apiKey','projectId','messagingSenderId','androidAppId','webAppId'] if not d.get(k)]; print('Fehlt in FIREBASE_CONFIG:', missing) if missing else print('FIREBASE_CONFIG ok'); exit(1 if missing else 0)"

      - name: Android- und Web-Projekt erzeugen
        run: |
          flutter create --platforms=android,web --org de.pinghunt --project-name pinghunt .
          rm -rf test
          python3 tool/patch_android.py
          sed -i 's#<title>[^<]*</title>#<title>PingHunt</title>#' web/index.html
          sed -i 's#"name": "pinghunt"#"name": "PingHunt"#; s#"short_name": "pinghunt"#"short_name": "PingHunt"#' web/manifest.json
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get 2>&1 | tee pub-get.log

      - name: Android-App bauen
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=config.json 2>&1 | tee build-apk.log
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/PingHunt.apk

      - name: Browser-Version bauen
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=config.json 2>&1 | tee build-web.log
          rm -f config.json

      - name: APK als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PingHunt 1.0.${{ github.run_number }}
          body: Neue Version von PingHunt. Lade unten PingHunt.apk herunter und installiere sie auf dem Handy.
          files: out/PingHunt.apk
          make_latest: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Fehlerprotokoll sichern
        if: failure()
        run: |
          mkdir -p /tmp/logs
          cp *.log /tmp/logs/ 2>/dev/null || echo "keine Logs" > /tmp/logs/none.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Fehlerprotokoll Lauf ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
