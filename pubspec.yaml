name: pinghunt
description: PingHunt – GPS-Spiel für Jäger und Gejagte.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  flutter_map: 7.0.2
  latlong2: 0.9.1
  geolocator: 13.0.1
  qr_flutter: 4.1.0
  mobile_scanner: 5.2.3
  shared_preferences: 2.3.2
  battery_plus: 6.0.3
  flutter_local_notifications: 17.2.4
  flutter_background_service: 5.0.10
  permission_handler: 11.3.1

dev_dependencies:
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/square.png"
  adaptive_icon_background: "#0B0E13"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#0B0E13"
    theme_color: "#FF6B2C"

dependency_overrides:
  # 4.6.2 setzt eine neuere Flutter-Version voraus
  geolocator_android: 4.6.1
