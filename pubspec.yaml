name: pinghunt
description: PingHunt – GPS-Spiel für Jäger und Gejagte.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  flutter_map: 7.0.2
  latlong2: 0.9.1
  geolocator: 13.0.1
  qr_flutter: 4.1.0
  mobile_scanner: 5.2.3
  shared_preferences: 2.3.2
  battery_plus: 6.0.3
  flutter_local_notifications: 17.2.4

flutter:
  uses-material-design: true

dependency_overrides:
  # 4.6.2 setzt eine neuere Flutter-Version voraus
  geolocator_android: 4.6.1
